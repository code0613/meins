name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      # package.json의 packageManager 필드를 따라 Yarn 4를 쓴다
      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn lint

      - run: yarn build
